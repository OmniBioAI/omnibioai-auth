[alembic]
script_location = alembic

# Intentionally no sqlalchemy.url here -- alembic/env.py sets it dynamically
# from app.core.config.settings.DATABASE_URL, the same connection string the
# running app uses. Avoids committing a DB host/credentials to version
# control and avoids the URL drifting out of sync with the app's own config.

prepend_sys_path = .

version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
