name: CI

# Lint/test hygiene on every push/PR. Multiarch production releases are a
# separate, manually-dispatched, controlled workflow -- see
# .github/workflows/publish-auth.yml -- not triggered by a tag push here.
# (The previous version of this file built/pushed a multiarch image via
# QEMU emulation on tag push; QEMU is not native-architecture evidence and
# that mechanism never actually produced a verified release -- see
# ~/OMNIBIOAI-AUTH-MULTIARCH-RELEASE-CLOSURE-2026-10-02.md.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      research-mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

      research-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          RESEARCH_TEST_MYSQL_PORT: "3306"
          RESEARCH_TEST_REDIS_PORT: "6379"
        run: pytest --tb=short -q
